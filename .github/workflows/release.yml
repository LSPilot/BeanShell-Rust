name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, bin: bsh, asset: bsh-linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, bin: bsh, asset: bsh-linux-aarch64 }
          - { os: macos-13, target: x86_64-apple-darwin, bin: bsh, asset: bsh-macos-x86_64 }
          - { os: macos-14, target: aarch64-apple-darwin, bin: bsh, asset: bsh-macos-arm64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, bin: bsh.exe, asset: bsh-windows-x86_64.exe }
    steps:
      - uses: actions/checkout@v4

      # crates/bsh-jvm/build.rs compiles the Java bridge with javac.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p bsh-cli

      - name: Collect
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  android:
    name: android-aar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          add-to-path: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build JNI libraries
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o dist/android build --release -p bsh-rs

      - name: Stage JNI libraries
        run: |
          for abi in arm64-v8a armeabi-v7a x86_64; do
            mkdir -p "android/bsh-rs/src/main/jniLibs/$abi"
            cp "dist/android/$abi/libbsh_rs.so" "android/bsh-rs/src/main/jniLibs/$abi/"
          done

      - name: Build AAR
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd android
          ./gradlew :bsh-rs:assembleRelease
          mkdir -p ../dist
          cp bsh-rs/build/outputs/aar/bsh-rs-release.aar "../dist/bsh-rs-android-$VERSION.aar"

      - name: Build demo APK
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd android
          ./gradlew :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "../dist/bsh-demo-$VERSION.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            dist/*.aar
            dist/*.apk
          if-no-files-found: error

  publish:
    name: Publish
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          fail_on_unmatched_files: true
          generate_release_notes: true
